<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Pixel Casino (Play Money)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#4c566c;min-height:100vh;
background-color:#c5ccd4;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 5px),repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 1px,transparent 1px 4px)}
/* nav bar */
.bar{position:sticky;top:0;z-index:5;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;
background:linear-gradient(#b0bccd,#889bb3 50%,#7e93ac 50%,#6d84a2);border-bottom:1px solid #2d3642;box-shadow:0 1px 3px rgba(0,0,0,.4),inset 0 1px #cdd5df}
.bar h1{margin:0;font-size:20px;color:#fff;text-shadow:0 -1px rgba(0,0,0,.5)}
.lcd{font:700 18px/1 "Courier New",monospace;color:#a9ff8c;background:linear-gradient(#0d1a0d,#1e301e);padding:7px 12px;border-radius:6px;border:1px solid #1d2733;box-shadow:inset 0 2px 4px #000,0 1px rgba(255,255,255,.4);text-shadow:0 0 6px #6f6;min-width:96px;text-align:right}
.navbtn{font:700 12px Helvetica;color:#fff;padding:7px 10px;border-radius:5px;border:1px solid #2f3e52;background:linear-gradient(#8fa3bd,#5f7a9c 50%,#4f6c92 50%,#4a6890);box-shadow:inset 0 1px rgba(255,255,255,.35),0 1px rgba(255,255,255,.3);text-shadow:0 -1px rgba(0,0,0,.5);cursor:pointer}
.navbtn:active{background:linear-gradient(#4a6890,#5f7a9c)}
/* segmented */
.seg{display:flex;max-width:560px;margin:14px auto 0;padding:0 12px}
.seg button{flex:1;font:700 13px Helvetica;padding:9px 0;color:#4c566c;cursor:pointer;border:1px solid #8d939b;border-left:0;background:linear-gradient(#fff,#e6e8eb 50%,#d9dce0 50%,#cfd3d8);text-shadow:0 1px #fff}
.seg button:first-child{border-left:1px solid #8d939b;border-radius:9px 0 0 9px}.seg button:last-child{border-radius:0 9px 9px 0}
.seg button.on{color:#fff;text-shadow:0 -1px rgba(0,0,0,.4);background:linear-gradient(#80a7e8,#4a82dc 50%,#2f6dd6 50%,#2e6fdb);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);border-color:#2a4f8a}
main{max-width:560px;margin:0 auto;padding:14px 12px 30px}
.game{display:none}.game.on{display:block;animation:in .35s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.panel{border-radius:12px;padding:18px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.3)}
/* chips */
.chips{display:flex;justify-content:center;gap:10px;margin:16px 0 4px}
.chip{width:52px;height:52px;border-radius:50%;cursor:pointer;border:0;font:800 13px Helvetica;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);position:relative;
background:repeating-conic-gradient(var(--c) 0 30deg,#fff 30deg 45deg);box-shadow:0 3px 0 rgba(0,0,0,.35),0 4px 6px rgba(0,0,0,.3);transition:transform .15s}
.chip::after{content:attr(data-v);position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--c),#fff 25%),var(--c));display:flex;align-items:center;justify-content:center;border:2px dashed rgba(255,255,255,.6)}
.chip.on{transform:translateY(-6px);box-shadow:0 9px 0 rgba(0,0,0,.25),0 0 0 3px #ffd95e,0 10px 12px rgba(0,0,0,.3)}
/* glossy buttons */
.gbtn{font:700 17px Helvetica;padding:12px 26px;border-radius:10px;cursor:pointer;color:#fff;text-shadow:0 -1px rgba(0,0,0,.45);border:1px solid #1b5e12;
background:linear-gradient(#8ee36b,#4fb52b 50%,#3c9e1b 50%,#45a823);box-shadow:inset 0 1px rgba(255,255,255,.6),0 2px 3px rgba(0,0,0,.4)}
.gbtn.red{border-color:#6b0d0d;background:linear-gradient(#f28b8b,#d93a3a 50%,#c31f1f 50%,#cc2a2a)}
.gbtn.blue{border-color:#1d3f75;background:linear-gradient(#8fb6f2,#4a82dc 50%,#2f6dd6 50%,#3474dd)}
.gbtn:active{filter:brightness(.88);transform:translateY(1px)}.gbtn:disabled{opacity:.45;pointer-events:none}
.btns{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
/* slots */
.machine{background:linear-gradient(90deg,#8a8f96,#e9ecef 18%,#bfc4ca 40%,#f5f6f7 60%,#9aa0a7);border:1px solid #6b7078}
.reels{display:flex;gap:8px;padding:10px;border-radius:10px;background:#222;box-shadow:inset 0 3px 8px #000}
.win{flex:1;height:110px;overflow:hidden;border-radius:6px;background:#fff;position:relative}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.55));pointer-events:none}
.strip{will-change:transform}.strip div{height:110px;display:flex;align-items:center;justify-content:center;font-size:58px}
.payline{position:absolute;left:18px;right:18px;top:50%;height:2px;background:rgba(220,30,30,.5);pointer-events:none}
/* felt */
.felt{background:radial-gradient(ellipse at center,#2f8a4a,#145a2a 75%);border:10px solid #5b3a1e;border-image:linear-gradient(#7a5230,#3e2511) 1;border-radius:0;box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.45);min-height:330px}
.felt::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,255,255,.15);pointer-events:none}
.lbl{color:rgba(255,255,255,.75);font:700 12px Helvetica;letter-spacing:2px;text-align:center;text-shadow:0 1px 2px #000}
.lbl b{background:rgba(0,0,0,.35);padding:2px 8px;border-radius:9px;letter-spacing:0;margin-left:4px}
.hand{display:flex;justify-content:center;min-height:100px;margin:6px 0 14px}
.card{width:66px;height:94px;perspective:600px;margin-left:-18px;animation:deal .45s cubic-bezier(.2,.8,.3,1) both}.card:first-child{margin-left:0}
@keyframes deal{from{transform:translate(160px,-160px) rotate(25deg);opacity:0}}
.ci{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}.card.down .ci{transform:rotateY(180deg)}
.cf,.cb{position:absolute;inset:0;border-radius:7px;backface-visibility:hidden;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.cf{background:linear-gradient(#fff,#f1efe8);color:#111;font:700 17px Georgia,serif;padding:4px 6px}.cf.r{color:#c0182b}
.cf .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.cb{transform:rotateY(180deg);background:#fff;padding:4px}.cb::after{content:"";display:block;height:100%;border-radius:4px;background:repeating-linear-gradient(45deg,#2a5db0 0 4px,#fff 4px 6px),#2a5db0}
/* roulette */
.wheelbox{position:relative;width:270px;height:270px;margin:4px auto}
.rim{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#6b4423 60%,#3b220f 72%,#8a5a2e 74%,#3b220f);box-shadow:0 6px 14px rgba(0,0,0,.6)}
.wheel{position:absolute;inset:22px;border-radius:50%;will-change:transform}
.wheel span{position:absolute;left:50%;top:0;height:50%;width:20px;margin-left:-10px;transform-origin:50% 100%;color:#fff;font:700 10px Helvetica;text-align:center;padding-top:5px}
.hub{position:absolute;inset:92px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f8e7a4,#b8892c 60%,#6b4c12);box-shadow:0 2px 6px #000}
#ball{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ddd 45%,#888);box-shadow:0 2px 3px rgba(0,0,0,.7);z-index:2;will-change:transform}
.custom{display:none;justify-content:center;margin:10px 0 0}.custom.on{display:flex;animation:in .25s}
.custom input{width:170px;font:700 18px Helvetica;text-align:center;padding:9px 12px;border-radius:16px;border:1px solid #8d939b;color:#2b3445;background:linear-gradient(#e9ecef,#fff 40%);box-shadow:inset 0 2px 3px rgba(0,0,0,.25),0 1px rgba(255,255,255,.8);outline:0}
.custom input:focus{border-color:#4a82dc;box-shadow:inset 0 2px 3px rgba(0,0,0,.25),0 0 0 3px rgba(74,130,220,.35)}
.bets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.bets button{font:700 13px Helvetica;padding:10px 0;border-radius:6px;border:1px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;background:rgba(0,0,0,.25);text-shadow:0 1px 1px #000}
.bets button.on{box-shadow:0 0 0 3px #ffd95e;background:rgba(255,217,94,.25)}
.bets .rd{background:#b3141f}.bets .bk{background:#151515}.bets .gr{background:#0f7a35}
/* coin */
.coinwrap{perspective:900px;width:150px;height:150px;margin:30px auto}
.coin{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.3,1.4,.4,1)}
.coin div{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font:900 54px Georgia,serif;color:#7a5a10;text-shadow:0 1px rgba(255,255,255,.6),0 -1px rgba(0,0,0,.3);
background:radial-gradient(circle at 35% 30%,#fff4c2,#e5bd4c 45%,#a87b1c);box-shadow:inset 0 0 0 6px #c99a2e,inset 0 0 0 8px #f2d785,0 8px 18px rgba(0,0,0,.45)}
.coin .t{transform:rotateY(180deg)}
.dark{background:linear-gradient(#3a3f47,#1f2328);border:1px solid #111}
/* toast */
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:9;min-width:180px;text-align:center;
background:rgba(0,0,0,.78);color:#fff;font:700 22px Helvetica;padding:18px 24px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast small{display:block;font-size:13px;opacity:.7;margin-top:4px}
.lcd.up{animation:glow .6s}@keyframes glow{50%{color:#fff;text-shadow:0 0 14px #afa}}
.lcd.down{animation:red .5s}@keyframes red{50%{color:#ff7a7a;text-shadow:0 0 10px #f44}}
.foot{text-align:center;font-size:11px;color:#6d7686;text-shadow:0 1px rgba(255,255,255,.6);margin-top:18px}
.sb{background:linear-gradient(#4a4f57,#24272c 50%,#1a1c20 50%,#202327);border:1px solid #0b0c0e;border-radius:12px;padding:10px 12px;box-shadow:inset 0 1px rgba(255,255,255,.2),0 2px 6px rgba(0,0,0,.4);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#fff;text-shadow:0 -1px #000}
.tm{display:flex;align-items:center;gap:8px;font:700 15px Helvetica}.tm.r{justify-content:flex-end}
.crest{width:26px;height:30px;border-radius:4px 4px 13px 13px;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 3px #000}
.score{text-align:center}.score .lcd{display:inline-block;font-size:26px;min-width:0;text-align:center;padding:6px 12px}.clock{font:700 12px Helvetica;color:#ffd95e;margin-top:4px}
.clock.live::before{content:"● ";color:#f44;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.pitch{position:relative;height:190px;margin-top:10px;border-radius:8px;overflow:hidden;border:2px solid #0b3d1c;box-shadow:inset 0 0 30px rgba(0,0,0,.4);
background:repeating-linear-gradient(90deg,#2f8f3f 0 10%,#36a046 10% 20%)}
.pitch svg{position:absolute;inset:0;width:100%;height:100%}
.sball{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ccc);box-shadow:0 2px 2px rgba(0,0,0,.5);transition:left .45s ease,top .45s ease;left:50%;top:50%;z-index:2}
.flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 44px Helvetica;color:#fff;text-shadow:0 3px 8px #000;opacity:0;transform:scale(.5);transition:all .3s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:3}.flash.show{opacity:1;transform:none}
.poss{height:8px;border-radius:4px;overflow:hidden;display:flex;margin:10px 0 4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}.poss div{transition:width .6s}
.stats{background:#fff;border:1px solid #a7adb5;border-radius:10px;margin-top:10px;box-shadow:0 1px rgba(255,255,255,.7)}
.stats div{display:grid;grid-template-columns:40px 1fr 40px;padding:7px 12px;border-top:1px solid #e1e4e8;font:700 13px Helvetica;text-align:center;color:#3b4456}.stats div:first-child{border:0}.stats span:nth-child(2){font-weight:400;color:#7d8696}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.odds button{font:700 12px Helvetica;padding:8px 0;border-radius:8px;cursor:pointer;color:#3b4456;border:1px solid #8d939b;background:linear-gradient(#fff,#e6e8eb 50%,#d9dce0 50%,#cfd3d8);text-shadow:0 1px #fff}
.odds button b{display:block;font-size:17px;color:#1d4ed8}.odds button.on{box-shadow:0 0 0 3px #ffd95e}.odds button:disabled{opacity:.55}
.feed{list-style:none;margin:10px 0 0;padding:0;background:#fff;border:1px solid #a7adb5;border-radius:10px;max-height:170px;overflow:auto}
.feed li{padding:7px 12px;border-top:1px solid #e1e4e8;font:13px Helvetica;animation:in .3s}.feed li:first-child{border:0}.feed li i{font-style:normal;font-weight:700;color:#7d8696;display:inline-block;width:38px}.feed li.g{background:#fff8d6;font-weight:700}
.cases{display:flex;gap:10px;justify-content:center}
.case{flex:1;max-width:170px;text-align:center;cursor:pointer;padding:12px 8px;border-radius:12px;background:linear-gradient(#3a3f47,#1f2328);border:1px solid #111;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.2);font:700 13px Helvetica}
.case.on{box-shadow:0 0 0 3px #ffd95e,0 2px 6px rgba(0,0,0,.4)}.case small{display:block;color:#ffd95e;margin-top:4px}
.scene{perspective:700px;height:130px;display:flex;align-items:center;justify-content:center}
.box{width:110px;height:70px;position:relative;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(-30deg);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:rotateX(-18deg) rotateY(-30deg) translateY(-6px)}}
.box.shake{animation:shake .7s}@keyframes shake{0%,100%{transform:rotateX(-18deg) rotateY(-30deg)}20%,60%{transform:rotateX(-18deg) rotateY(-24deg) translateX(-4px)}40%,80%{transform:rotateX(-18deg) rotateY(-36deg) translateX(4px)}}
.box div{position:absolute;border:1px solid rgba(0,0,0,.4);background:var(--k);box-shadow:inset 0 0 18px rgba(0,0,0,.35)}
.box .f,.box .b{width:110px;height:70px}.box .l,.box .r{width:50px;height:70px;left:30px}.box .t,.box .u{width:110px;height:50px;top:10px}
.box .f{transform:translateZ(25px)}.box .b{transform:rotateY(180deg) translateZ(25px)}.box .l{transform:rotateY(-90deg) translateZ(55px)}.box .r{transform:rotateY(90deg) translateZ(55px)}
.box .t{transform:rotateX(90deg) translateZ(35px);transform-origin:50% 50%;transition:transform .5s}.box .u{transform:rotateX(-90deg) translateZ(35px)}
.box.open .t{transform:rotateX(90deg) translateZ(35px) translateY(-30px) rotateX(-70deg)}
.box .f::after{content:"";position:absolute;inset:18px 30px;border:2px solid rgba(255,255,255,.5);border-radius:4px}
.reelbox{position:relative;height:120px;overflow:hidden;border-radius:8px;background:#15181c;box-shadow:inset 0 2px 10px #000;display:none;margin:6px 0}.reelbox.on{display:block}
.reelbox::before,.reelbox::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}.reelbox::before{left:0;background:linear-gradient(90deg,#15181c,transparent)}.reelbox::after{right:0;background:linear-gradient(-90deg,#15181c,transparent)}
.mark{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#ffd95e;z-index:3;box-shadow:0 0 8px #ffd95e}
.strip2{display:flex;gap:4px;padding:6px 0;will-change:transform}
.it{flex:none;width:126px;height:108px;border-radius:6px;background:linear-gradient(#2b3038,#1b1f24);border-bottom:4px solid var(--rc);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ddd;font:10px Helvetica;overflow:hidden}
.it::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 80%,var(--rc),transparent 70%);opacity:.25}
.it svg{width:104px;height:44px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6));position:relative}.it b{font-size:11px;color:#fff;position:relative;margin-top:4px}.it span{position:relative;opacity:.75}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;margin-top:10px}
.inv .it{width:auto;cursor:pointer;transition:transform .15s;transform-style:preserve-3d}.inv .it em{position:relative;font-style:normal;color:#ffd95e;font-weight:700;margin-top:2px}
.invhead{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font:700 14px Helvetica;color:#4c566c;text-shadow:0 1px rgba(255,255,255,.7)}
.invhead button{font:700 12px Helvetica}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:8;display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex;animation:in .25s}
.mcard{width:100%;max-width:400px;border-radius:14px;padding:18px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc),#000 55%),#14171b 70%);border:1px solid #000;box-shadow:0 0 40px color-mix(in srgb,var(--rc),transparent 50%)}
.mcard h3{margin:4px 0 2px;font:700 20px Helvetica}.mcard p{margin:0;opacity:.75;font:13px Helvetica}.mcard .val{font:700 22px Helvetica;color:#ffd95e;margin-top:8px}
.stage{perspective:800px;height:170px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.i3d{width:240px;height:84px;position:relative;transform-style:preserve-3d}
.i3d svg{position:absolute;inset:0;width:100%;height:100%}
.rar{display:inline-block;padding:2px 8px;border-radius:9px;background:var(--rc);font:700 11px Helvetica;margin-top:6px}
.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{transform:scale(.3) rotateY(-120deg);opacity:0}}
.track{position:relative;border-radius:10px;overflow:hidden;border:6px solid #f2f2f2;box-shadow:0 2px 6px rgba(0,0,0,.4);background:repeating-linear-gradient(0deg,#9b6b3d 0 26px,#8a5d33 26px 27px)}
.lane{position:relative;height:27px}.lane i{position:absolute;left:4px;top:5px;width:16px;height:16px;border-radius:3px;font:700 10px/16px Helvetica;color:#fff;text-align:center;font-style:normal;z-index:1;box-shadow:0 1px 2px #000}
.hz{position:absolute;top:1px;font-size:22px;transform:scaleX(-1);will-change:left;left:2%;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.hz.run{animation:gal .25s infinite alternate}@keyframes gal{to{margin-top:-3px}}
.fin{position:absolute;top:0;bottom:0;right:4%;width:8px;background:repeating-linear-gradient(0deg,#fff 0 6px,#111 6px 12px);z-index:0}
.runners{background:#fff;border:1px solid #a7adb5;border-radius:10px;margin-top:10px;overflow:hidden}
.runners div{display:grid;grid-template-columns:22px 1fr 60px 60px;gap:6px;align-items:center;padding:7px 10px;border-top:1px solid #e1e4e8;font:13px Helvetica;color:#3b4456}.runners div:first-child{border:0}
.runners i{width:18px;height:18px;border-radius:3px;font:700 11px/18px Helvetica;color:#fff;text-align:center;font-style:normal}
.runners button{font:700 12px Helvetica;padding:6px 0;border-radius:6px;cursor:pointer;color:#3b4456;border:1px solid #8d939b;background:linear-gradient(#fff,#e6e8eb 50%,#d9dce0 50%,#cfd3d8)}
.runners button.on{box-shadow:0 0 0 3px #ffd95e}.runners button small{display:block;font-size:9px;color:#7d8696}
.runners div.p1{background:#fff8d6}.call{text-align:center;font:700 14px Helvetica;color:#3b4456;text-shadow:0 1px #fff;min-height:20px;margin:8px 0 0}
.dealer{position:relative;height:200px;display:flex;justify-content:center;margin-bottom:-62px;z-index:0;pointer-events:none}
.dealer img{height:200px;transform-origin:50% 100%;animation:idle 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
@keyframes idle{50%{transform:translateY(-3px) rotate(.6deg)}}
.dealer.deal img{animation:lean .35s ease}@keyframes lean{50%{transform:rotate(-5deg) translateY(4px)}}
.dealer.cheer img{animation:jump .7s cubic-bezier(.3,1.6,.5,1) 2}@keyframes jump{40%{transform:translateY(-38px) rotate(-3deg)}}

  c.save();c.rotate((i+.5)*wseg);c.fillStyle=m?'#fff':'#616161';c.font='600 15px Segoe UI,sans-serif';c.textAlign='center';c.fillText(m+'×',0,-R+26);c.restore()});
